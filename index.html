<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SO-Price</title>
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="./icons/favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#1d2026" />

  <!-- Preconnects (меньше RTT) -->
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Шрифт без render-blocking @import -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet" />

  <!-- CSS -->
  <link rel="stylesheet" href="./css/app.css" />

  <!-- Module preload (ускоряем загрузку app.js) -->
  <link rel="modulepreload" href="./js/app.js" />
  <link rel="modulepreload" href="./js/utils.js" />
  <link rel="modulepreload" href="./js/sources.js" />
  <link rel="modulepreload" href="./js/board.js" />
</head>
<body>
  <div id="root"></div>
  <div id="errorBox" class="alert" role="alert" aria-live="polite"></div>

  <!-- React (UMD) с defer, чтобы не блокировать отрисовку -->
  <script defer crossorigin="anonymous" src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"
          integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"></script>
  <script defer crossorigin="anonymous" src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"
          integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"></script>

  <!-- App -->
  <script defer type="module" src="./js/app.js"></script>
</body>
</html>
